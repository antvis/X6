name: Deploy site to gh-pages

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: ⤵️　Checkout
        uses: actions/checkout@v3
        with:
          persist-credentials: false

      - name: 🎉　Setup Node.js
        uses: actions/setup-node@v4
        with:
          # pnpm 11.5+ 依赖 node:sqlite，需要 Node >= 22.13
          node-version: 22.23.4

      - name: 🚧　Install
        run: |
          npm i pnpm@10.34.5 -g
          pnpm install --no-frozen-lockfile

      - name: 🚀　Build site
        run: |
          cd ./site && pnpm run build

      - name: 👩‍⚕️　Verify site build output
        run: |
          if [ ! -d "site/dist" ]; then
            echo "Site build output directory (site/dist) not found; cannot publish to gh-pages."
            exit 1
          fi

      - name: 🗂　Commit site build output
        run: |
          cd site/dist
          touch .nojekyll
          git init
          git config --local user.name antv
          git config --local user.email antv@antfin.com
          git add .
          git commit -m "docs: deploy site to gh-pages"

      - name: 📦　Push site build output to gh-pages
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{secrets.PERSONAL_ACCESS_TOKEN}}
          directory: site/dist
          branch: gh-pages
          force: true
